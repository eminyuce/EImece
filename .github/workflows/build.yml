# SonarQube analysis via GitHub Actions
# Requires repository secrets:
#   SONAR_TOKEN      - token from SonarQube (My Account > Security)
#   SONAR_HOST_URL   - public URL to your SonarQube (ngrok), e.g.
#                      https://refill-juniper-amigo.ngrok-free.dev
#                      Do NOT use http://localhost:9000 — GitHub runners cannot reach it.
#
# Keep Docker SonarQube + ngrok running while the workflow executes.
name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  SOLUTION: EImece/EImece.sln
  CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones hurt blame / new-code detection

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: zulu

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path "${{ runner.temp }}\scanner" -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}\scanner"

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore "${{ env.SOLUTION }}" -NonInteractive -Verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed with exit code $LASTEXITCODE" }

      - name: Build and analyze
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) { throw "Missing secret SONAR_TOKEN" }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) { throw "Missing secret SONAR_HOST_URL" }
          if ($env:SONAR_HOST_URL -match 'localhost|127\.0\.0\.1') {
            throw "SONAR_HOST_URL must be your public ngrok HTTPS URL, not localhost."
          }

          $scanner = Join-Path "${{ runner.temp }}" "scanner\dotnet-sonarscanner.exe"

          & $scanner begin `
            /k:"Eimece" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="$env:SONAR_HOST_URL" `
            /d:sonar.scanner.scanAll=false

          msbuild "${{ env.SOLUTION }}" `
            /t:Rebuild `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:DeployOnBuild=false `
            /m `
            /nologo `
            /v:minimal `
            /clp:Summary
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

          & $scanner end /d:sonar.token="$env:SONAR_TOKEN"
