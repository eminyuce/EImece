<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Edit Form Mobile Fixture</title>
    <link rel="stylesheet" href="../EImece/Content/admin-vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../EImece/Content/adminSite.css">
    <link rel="stylesheet" href="../EImece/Content/adminShell.css">
    <link rel="stylesheet" href="../EImece/Content/adminGridModern.css">
    <link rel="stylesheet" href="../EImece/Content/adminMobile.css">
    <style>
        body { margin: 0; background: #f4f7fa; }
        .admin-main { margin-left: 0 !important; }
    </style>
</head>
<body class="admin-app">
    <div class="admin-main">
        <main class="admin-content">
            <h2 class="admin-page-title">Edit Product</h2>
            <div class="row">
                <div class="col-md-3 eg-products-tree-col">
                    <div class="card"><div class="card-body">Category tree placeholder</div></div>
                </div>
                <div class="col-md-9 eg-products-main-col">
                    <div class="card admin-edit-form">
                        <div class="admin-edit-tabs-heading">
                            <ul class="nav nav-tabs admin-edit-tabs">
                                <li class="nav-item"><a class="nav-link active" href="#">Fields</a></li>
                                <li class="nav-item"><a class="nav-link" href="#">Content</a></li>
                            </ul>
                            <div class="admin-edit-toolbar-actions">
                                <button type="button" class="btn btn-success admin-edit-save-btn">Save</button>
                                <button type="button" class="btn btn-primary admin-edit-save-close-btn">Save &amp; Close</button>
                                <a href="#" class="btn btn-outline-secondary admin-edit-back-to-list-btn">Back to list</a>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="form-group row mb-3">
                                <label class="col-md-2 col-form-label">Name</label>
                                <div class="col-md-10">
                                    <input type="text" class="form-control" value="Sample product" />
                                </div>
                            </div>
                            <div class="form-group row mb-3">
                                <label class="col-md-2 col-form-label">Price</label>
                                <div class="col-md-4">
                                    <input type="number" class="form-control" value="1250" />
                                </div>
                            </div>
                            <dl class="dl-horizontal">
                                <dt>Status</dt>
                                <dd><textarea class="eg-admin-fluid-textarea" readonly>Active listing</textarea></dd>
                            </dl>
                            <div class="form-group row mb-3">
                                <label class="col-md-2 col-form-label">Ship date</label>
                                <div class="col-md-5">
                                    <input type="date" class="form-control eg-spec-date-input" value="2026-09-04" />
                                </div>
                            </div>
                            <div class="settings-center-container">
                                <div class="settings-search-wrapper">
                                    <input type="text" id="globalSettingsSearch" class="form-control" placeholder="Search settings" />
                                </div>
                                <div id="stickySaveBar" class="card">
                                    <div class="card-body d-flex gap-2">
                                        <button type="button" class="btn btn-outline-secondary">Reset</button>
                                        <button type="submit" class="btn btn-success">Save settings</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
