  <!-- Tag Pill Top Right -->
  <rect x="242" y="14" width="64" height="14" rx="7" fill="#3b82f6" fill-opacity="0.1" />
  <text x="274" y="24" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="bold" fill="#3b82f6" text-anchor="middle">TEMA 4</text>
