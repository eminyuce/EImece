    <rect x="214" y="126" width="92" height="30" rx="4" fill="url(#imgGrad4)" />
    <rect x="218" y="146" width="16" height="7" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="220" y="161" width="67" height="4" rx="1" fill="#334155" />
    <rect x="220" y="168" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="220" y="175" width="28" height="4" rx="1" fill="#3b82f6" />
