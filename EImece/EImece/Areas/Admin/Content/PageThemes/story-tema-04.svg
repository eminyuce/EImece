    <rect x="18" y="78" width="16" height="7" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="20" y="93" width="70" height="4" rx="1" fill="#334155" />
    <rect x="20" y="100" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="20" y="107" width="28" height="4" rx="1" fill="#3b82f6" />
  </g>

  <!-- Card (1,2) -->
