    <rect x="114" y="126" width="92" height="30" rx="4" fill="url(#imgGrad4)" />
    <rect x="118" y="146" width="16" height="7" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="120" y="161" width="70" height="4" rx="1" fill="#334155" />
