<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="imgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow4" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="200" fill="url(#bgGrad4)" rx="6" />

  <!-- Breadcrumb & Header -->
  <rect x="14" y="12" width="50" height="4" rx="2" fill="#94a3b8" />
  <rect x="14" y="20" width="90" height="8" rx="2" fill="#1e293b" />
  <rect x="14" y="32" width="140" height="4" rx="2" fill="#cbd5e1" />

  <!-- Top Filter / Tag Bar -->
  <rect x="14" y="42" width="40" height="10" rx="5" fill="#3b82f6" />
  <rect x="58" y="42" width="45" height="10" rx="5" fill="#e2e8f0" />
  <rect x="107" y="42" width="50" height="10" rx="5" fill="#e2e8f0" />
  <rect x="161" y="42" width="38" height="10" rx="5" fill="#e2e8f0" />
  <rect x="203" y="42" width="48" height="10" rx="5" fill="#e2e8f0" />

  <!-- 3x2 Full Width Card Grid -->
