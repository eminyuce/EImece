<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="imgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow5" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="200" fill="url(#bgGrad5)" rx="6" />

  <!-- Breadcrumb & Header -->
  <rect x="14" y="10" width="50" height="3" rx="1.5" fill="#94a3b8" />
  <rect x="14" y="16" width="90" height="7" rx="2" fill="#1e293b" />

  <!-- Featured / Hero Card (Span across top) -->
  <g filter="url(#shadow5)">
    <rect x="14" y="28" width="292" height="62" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Big Hero Image -->
    <rect x="18" y="32" width="130" height="54" rx="3" fill="url(#heroGrad)" />
    <!-- Featured Badge -->
    <rect x="24" y="38" width="38" height="8" rx="2" fill="#3b82f6" />
    <text x="43" y="44" font-family="-apple-system,sans-serif" font-size="5" font-weight="bold" fill="#ffffff" text-anchor="middle">ÖNE ÇIKAN</text>
    <!-- Hero Details Right -->
    <rect x="156" y="35" width="40" height="4" rx="1" fill="#3b82f6" />
    <rect x="156" y="42" width="140" height="6" rx="1.5" fill="#0f172a" />
    <rect x="156" y="52" width="144" height="3" rx="1" fill="#64748b" />
    <rect x="156" y="58" width="130" height="3" rx="1" fill="#64748b" />
    <rect x="156" y="64" width="100" height="3" rx="1" fill="#94a3b8" />
    <rect x="156" y="74" width="45" height="7" rx="2" fill="#0f172a" />
  </g>

  <!-- Bottom Section: 2 Column Grid (col-8) + Sidebar (col-4) -->
  <!-- Left Side: 2 Grid Cards -->
  <!-- Card 1 -->
  <g filter="url(#shadow5)">
    <rect x="14" y="96" width="90" height="88" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="96" width="90" height="42" rx="4" fill="url(#imgGrad5)" />
    <rect x="18" y="126" width="16" height="8" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="20" y="145" width="70" height="4" rx="1" fill="#334155" />
    <rect x="20" y="152" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="20" y="158" width="50" height="3" rx="1" fill="#cbd5e1" />
    <rect x="20" y="168" width="28" height="6" rx="2" fill="#3b82f6" />
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow5)">
    <rect x="110" y="96" width="90" height="88" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="110" y="96" width="90" height="42" rx="4" fill="url(#imgGrad5)" />
    <rect x="114" y="126" width="16" height="8" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="116" y="145" width="68" height="4" rx="1" fill="#334155" />
    <rect x="116" y="152" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="116" y="158" width="50" height="3" rx="1" fill="#cbd5e1" />
    <rect x="116" y="168" width="28" height="6" rx="2" fill="#3b82f6" />
  </g>

  <!-- Right Sidebar (col-4) -->
  <g filter="url(#shadow5)">
    <rect x="208" y="96" width="98" height="88" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="216" y="104" width="50" height="4" rx="1" fill="#0f172a" />
    <line x1="216" y1="111" x2="298" y2="111" stroke="#f1f5f9" stroke-width="1" />
    <rect x="216" y="115" width="68" height="3" rx="1" fill="#3b82f6" />
    <rect x="216" y="122" width="58" height="3" rx="1" fill="#64748b" />
    <rect x="216" y="129" width="72" height="3" rx="1" fill="#64748b" />
    <!-- Tags -->
    <rect x="216" y="140" width="40" height="4" rx="1" fill="#0f172a" />
    <line x1="216" y1="147" x2="298" y2="147" stroke="#f1f5f9" stroke-width="1" />
    <rect x="216" y="152" width="24" height="8" rx="2" fill="#e0e7ff" />
    <rect x="244" y="152" width="30" height="8" rx="2" fill="#f1f5f9" />
    <rect x="216" y="163" width="32" height="8" rx="2" fill="#f1f5f9" />
    <rect x="252" y="163" width="28" height="8" rx="2" fill="#f1f5f9" />
  </g>

  <!-- Tag Pill Top Right -->
  <rect x="242" y="10" width="64" height="14" rx="7" fill="#3b82f6" fill-opacity="0.1" />
  <text x="274" y="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="bold" fill="#3b82f6" text-anchor="middle">TEMA 5</text>
</svg>
