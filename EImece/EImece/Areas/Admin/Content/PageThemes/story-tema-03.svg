<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="imgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow3" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="200" fill="url(#bgGrad3)" rx="6" />

  <!-- Breadcrumb & Header -->
  <rect x="14" y="12" width="50" height="4" rx="2" fill="#94a3b8" />
  <rect x="14" y="20" width="90" height="8" rx="2" fill="#1e293b" />
  <rect x="14" y="32" width="140" height="4" rx="2" fill="#cbd5e1" />

  <!-- Left Main Column (col-8) - 2x2 Grid of Cards -->
  <!-- Card (1,1) -->
  <g filter="url(#shadow3)">
    <rect x="14" y="44" width="90" height="66" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="44" width="90" height="34" rx="4" fill="url(#imgGrad3)" />
    <rect x="18" y="66" width="16" height="8" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="20" y="83" width="70" height="4" rx="1" fill="#334155" />
    <rect x="20" y="90" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="20" y="96" width="50" height="3" rx="1" fill="#cbd5e1" />
    <rect x="20" y="103" width="26" height="4" rx="1.5" fill="#3b82f6" />
  </g>

  <!-- Card (1,2) -->
  <g filter="url(#shadow3)">
    <rect x="110" y="44" width="90" height="66" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="110" y="44" width="90" height="34" rx="4" fill="url(#imgGrad3)" />
    <rect x="114" y="66" width="16" height="8" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="116" y="83" width="65" height="4" rx="1" fill="#334155" />
    <rect x="116" y="90" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="116" y="96" width="55" height="3" rx="1" fill="#cbd5e1" />
    <rect x="116" y="103" width="26" height="4" rx="1.5" fill="#3b82f6" />
  </g>

  <!-- Card (2,1) -->
  <g filter="url(#shadow3)">
    <rect x="14" y="116" width="90" height="66" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="116" width="90" height="34" rx="4" fill="url(#imgGrad3)" />
    <rect x="18" y="138" width="16" height="8" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="20" y="155" width="68" height="4" rx="1" fill="#334155" />
    <rect x="20" y="162" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="20" y="168" width="45" height="3" rx="1" fill="#cbd5e1" />
    <rect x="20" y="175" width="26" height="4" rx="1.5" fill="#3b82f6" />
  </g>

  <!-- Card (2,2) -->
  <g filter="url(#shadow3)">
    <rect x="110" y="116" width="90" height="66" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="110" y="116" width="90" height="34" rx="4" fill="url(#imgGrad3)" />
    <rect x="114" y="138" width="16" height="8" rx="2" fill="#1e293b" opacity="0.85" />
    <rect x="116" y="155" width="72" height="4" rx="1" fill="#334155" />
    <rect x="116" y="162" width="78" height="3" rx="1" fill="#94a3b8" />
    <rect x="116" y="168" width="50" height="3" rx="1" fill="#cbd5e1" />
    <rect x="116" y="175" width="26" height="4" rx="1.5" fill="#3b82f6" />
  </g>

  <!-- Right Sidebar (col-4) -->
  <!-- Widget 1: Categories -->
  <g filter="url(#shadow3)">
    <rect x="208" y="44" width="98" height="74" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="216" y="52" width="50" height="5" rx="1.5" fill="#0f172a" />
    <line x1="216" y1="61" x2="298" y2="61" stroke="#f1f5f9" stroke-width="1" />
    <rect x="216" y="66" width="68" height="4" rx="1" fill="#3b82f6" />
    <rect x="216" y="76" width="60" height="4" rx="1" fill="#64748b" />
    <rect x="216" y="86" width="72" height="4" rx="1" fill="#64748b" />
    <rect x="216" y="96" width="55" height="4" rx="1" fill="#64748b" />
    <rect x="216" y="106" width="64" height="4" rx="1" fill="#64748b" />
  </g>

  <!-- Widget 2: Tags -->
  <g filter="url(#shadow3)">
    <rect x="208" y="124" width="98" height="58" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="216" y="132" width="40" height="5" rx="1.5" fill="#0f172a" />
    <line x1="216" y1="141" x2="298" y2="141" stroke="#f1f5f9" stroke-width="1" />
    <rect x="216" y="146" width="24" height="9" rx="3" fill="#e0e7ff" />
    <rect x="244" y="146" width="30" height="9" rx="3" fill="#f1f5f9" />
    <rect x="278" y="146" width="20" height="9" rx="3" fill="#f1f5f9" />
    <rect x="216" y="159" width="32" height="9" rx="3" fill="#f1f5f9" />
    <rect x="252" y="159" width="28" height="9" rx="3" fill="#f1f5f9" />
  </g>

  <!-- Tag Pill Top Right -->
  <rect x="242" y="14" width="64" height="14" rx="7" fill="#3b82f6" fill-opacity="0.1" />
  <text x="274" y="24" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="bold" fill="#3b82f6" text-anchor="middle">TEMA 3</text>
</svg>
